apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kestrel

resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: kestrel

images:
  - name: kestrel/sidecar
    newTag: latest
  - name: kestrel/sidecar:dev
    newTag: dev
