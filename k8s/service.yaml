apiVersion: v1
kind: Service
metadata:
  name: kestrel-sidecar
  namespace: kestrel
  labels:
    app.kubernetes.io/name: kestrel
    app.kubernetes.io/component: sidecar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kestrel
    app.kubernetes.io/component: sidecar
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kestrel-sidecar
  namespace: kestrel-dev
  labels:
    app.kubernetes.io/name: kestrel
    app.kubernetes.io/component: sidecar
    app.kubernetes.io/environment: development
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kestrel
    app.kubernetes.io/component: sidecar
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
